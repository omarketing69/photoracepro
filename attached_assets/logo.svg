<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#1e40af"/>
  
  <!-- Camera Icon -->
  <g transform="translate(200, 150)">
    <!-- Camera Body -->
    <rect x="50" y="100" width="300" height="200" rx="20" fill="#ffffff" stroke="#1e40af" stroke-width="4"/>
    <!-- Lens -->
    <circle cx="200" cy="200" r="70" fill="#1e40af" stroke="#ffffff" stroke-width="6"/>
    <circle cx="200" cy="200" r="40" fill="#ffffff"/>
    <!-- Flash -->
    <rect x="280" y="120" width="40" height="20" rx="10" fill="#fbbf24"/>
    <!-- Viewfinder -->
    <rect x="120" y="80" width="60" height="30" rx="5" fill="#ffffff" stroke="#1e40af" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff">
    RacePhoto Pro
  </text>
  
  <!-- Tagline -->
  <text x="400" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#93c5fd">
    Reconocimiento automático de dorsales
  </text>
  
  <!-- Racing Elements -->
  <g transform="translate(50, 480)">
    <!-- Finish Line -->
    <rect x="0" y="0" width="700" height="20" fill="#ffffff"/>
    <rect x="0" y="0" width="35" height="20" fill="#000000"/>
    <rect x="70" y="0" width="35" height="20" fill="#000000"/>
    <rect x="140" y="0" width="35" height="20" fill="#000000"/>
    <rect x="210" y="0" width="35" height="20" fill="#000000"/>
    <rect x="280" y="0" width="35" height="20" fill="#000000"/>
    <rect x="350" y="0" width="35" height="20" fill="#000000"/>
    <rect x="420" y="0" width="35" height="20" fill="#000000"/>
    <rect x="490" y="0" width="35" height="20" fill="#000000"/>
    <rect x="560" y="0" width="35" height="20" fill="#000000"/>
    <rect x="630" y="0" width="35" height="20" fill="#000000"/>
  </g>
  
  <!-- Numbers (representing dorsals) -->
  <text x="100" y="80" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">123</text>
  <text x="650" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">456</text>
  <text x="700" y="350" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#fbbf24">789</text>
</svg>